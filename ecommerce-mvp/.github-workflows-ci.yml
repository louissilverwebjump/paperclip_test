name: QA Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'ecommerce-mvp/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ecommerce-mvp/**'

defaults:
  run:
    working-directory: ecommerce-mvp

jobs:
  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ecommerce-mvp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Add test dependencies
        run: npm install --save-dev jest ts-jest @types/jest

      - name: Run unit tests with coverage
        run: npx jest --coverage --passWithNoTests
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ecommerce-mvp/coverage/

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ecommerce-mvp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Add Playwright
        run: npm install --save-dev @playwright/test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: file:./test.db

      - name: Seed test database
        run: npm run db:seed
        env:
          DATABASE_URL: file:./test.db

      - name: Start application
        run: npm run start &
        env:
          DATABASE_URL: file:./test.db
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run E2E tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ecommerce-mvp/playwright-report/
          retention-days: 14

  qa-sign-off:
    name: QA Sign-off Gate (Production Only)
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - name: All checks passed — awaiting QA approval
        run: |
          echo "Unit tests: PASSED"
          echo "E2E tests: PASSED"
          echo "Awaiting QA Engineer manual approval for production deploy."
